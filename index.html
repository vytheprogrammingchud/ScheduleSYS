<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ali's efficiency thingy majigy - Login</title>
  <style>
    :root {
      --xp-blue-dark: #0055ea;
      --xp-bg-gray: #ece9d8;
      --urgent-red: #d9381e;
      --urgent-bg: #fde8e8;
      --urgent-border: #b8250e;
    }

    body {
      font-family: "Tahoma", "Segoe UI", sans-serif;
      background: linear-gradient(135deg, #003399 0%, #3d7fb9 50%, #003399 100%);
      background-size: cover;
      height: 100vh;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    /* XP Logon Box Container */
    .xp-logon-box {
      width: 480px;
      background: linear-gradient(180deg, #1b6cd5 0%, #1555ab 100%);
      border: 2px solid #002266;
      box-shadow: 6px 6px 20px rgba(0, 0, 0, 0.6);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 40px 20px;
      border-radius: 4px;
    }

    .logon-right {
      background: #ece9d8;
      padding: 24px;
      border: 1px solid #7f9db9;
      box-shadow: inset 1px 1px 0px #fff;
      width: 300px;
      border-radius: 3px;
    }

    .logon-right label {
      display: block;
      font-size: 0.8rem;
      font-weight: bold;
      color: #0a246a;
      margin-bottom: 4px;
    }

    .logon-right input {
      width: 100%;
      padding: 5px;
      margin-bottom: 14px;
      border: 1px solid #7f9db9;
      background: #fff;
      font-size: 0.9rem;
      box-sizing: border-box;
    }

    .logon-btn-container {
      text-align: right;
    }

    .xp-ok-btn {
      background: linear-gradient(180deg, #fff 0%, #ece9d8 100%);
      border: 1px solid #003c74;
      padding: 4px 18px;
      font-size: 0.85rem;
      font-weight: bold;
      cursor: pointer;
      border-radius: 3px;
      color: #000;
    }
    .xp-ok-btn:hover {
      background: linear-gradient(180deg, #ece9d8 0vh, #dfdbcd 100%);
      border-color: #002266;
    }

    .error-msg {
      color: red;
      font-size: 0.75srem;
      margin-bottom: 10px;
      display: none;
    }

    /* Main Dashboard App Style (Hidden Until Login) */
    #dashboard-app {
      display: none;
      width: 100%;
      height: 100vh;
      background-color: #5a7edc;
      padding: 20px;
      box-sizing: border-box;
      overflow-y: auto;
    }

    .xp-window {
      max-width: 850px;
      margin: 0 auto;
      background-color: var(--xp-bg-gray);
      border: 3px solid #003c74;
      border-radius: 8px 8px 0 0;
      box-shadow: 4px 4px 12px rgba(0, 0, 0, 0.4);
      overflow: hidden;
    }

    .xp-title-bar {
      background: linear-gradient(180deg, #0058ee 0%, #3593ff 4%, #288eff 18%, #0055ea 100%);
      padding: 6px 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: #ffffff;
      font-weight: bold;
      font-size: 0.9rem;
      text-shadow: 1px 1px 1px #000;
    }

    .xp-title-text { display: flex; align-items: center; gap: 6px; }
    .xp-window-controls { display: flex; gap: 3px; }
    .xp-btn {
      background: linear-gradient(180deg, #fff 0%, #ece9d8 100%);
      border: 1px solid #003c74;
      border-radius: 3px;
      width: 21px;
      height: 21px;
      font-size: 0.7rem;
      font-weight: bold;
      cursor: pointer;
    }
    .xp-close {
      background: linear-gradient(180deg, #e97868 0%, #c42f1a 100%);
      color: white;
      border-color: #7a0000;
    }

    .xp-body { padding: 16px; }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px groove #fff;
      padding-bottom: 10px;
      margin-bottom: 12px;
    }
    .app-title { font-size: 1.3rem; margin: 0; color: #0a246a; }
    .subtitle { margin: 2px 0 0 0; font-size: 0.8rem; color: #444; }
    .clock-box { text-align: right; background: #fff; padding: 4px 10px; border: 2px inset #7f9db9; }
    #clock { font-family: "Courier New", monospace; font-size: 1.1rem; font-weight: bold; }
    .timezone { font-size: 0.7rem; color: #666; }

    .urgent-alert-banner {
      background-color: var(--urgent-bg);
      border: 2px solid var(--urgent-border);
      border-left: 8px solid var(--urgent-red);
      padding: 10px 14px;
      margin-bottom: 14px;
      box-shadow: 2px 2px 4px rgba(0,0,0,0.1);
    }
    .urgent-alert-item { color: #721c24; font-size: 0.85rem; font-weight: bold; margin-bottom: 4px; }
    .urgent-alert-item:last-child { margin-bottom: 0; }
    .urgent-badge {
      background-color: var(--urgent-red);
      color: #fff;
      font-size: 0.65rem;
      padding: 2px 6px;
      border-radius: 2px;
      text-transform: uppercase;
      margin-right: 6px;
    }

    .last-updated { font-size: 0.75rem; color: #555; margin-bottom: 14px; }

    .schedule-table {
      width: 100%;
      border-collapse: collapse;
      background: #ffffff;
      border: 2px inset #7f9db9;
      margin-bottom: 16px;
    }
    .schedule-table th {
      background: linear-gradient(180deg, #fff 0%, #ece9d8 100%);
      border-right: 1px solid #919b9c;
      border-bottom: 1px solid #919b9c;
      padding: 6px 10px;
      font-size: 0.8rem;
      text-align: left;
      color: #0a246a;
    }
    .schedule-table td {
      padding: 8px 10px;
      border-bottom: 1px solid #e5e5e5;
      font-size: 0.85rem;
      vertical-align: top;
    }
    .time-col { width: 130px; font-weight: bold; }
    .sub-time { font-weight: normal; font-size: 0.75rem; color: #555; }
    .detail-col { display: flex; gap: 8px; }
    .item-title { font-weight: bold; color: #111; }
    .item-desc { font-size: 0.8rem; color: #444; margin-top: 2px; }

    .badge {
      display: inline-block;
      padding: 2px 6px;
      border: 1px solid #7f9db9;
      font-size: 0.7rem;
      font-weight: bold;
      background: #ece9d8;
    }
    .badge-paid { background: #d4edda; color: #155724; border-color: #c3e6cb; }
    .badge-to-do { background: #fff3cd; color: #856404; border-color: #ffeeba; }
    .badge-booked { background: #cce5ff; color: #004085; border-color: #b8daff; }
    .badge-class { background: #e2e3e5; color: #383d41; border-color: #d6d8db; }
    .badge-exam { background: #f8d7da; color: #721c24; border-color: #f5c6cb; }

    .xp-status-bar {
      background: var(--xp-bg-gray);
      border-top: 2px groove #fff;
      padding: 4px 10px;
      font-size: 0.75rem;
      color: #444;
      display: flex;
      justify-content: space-between;
    }
    .archive-section summary {
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: bold;
      color: #0a246a;
      margin-bottom: 8px;
    }
  </style>
</head>
<body>

  <!-- Windows XP Clean Login Screen -->
  <div id="login-screen" class="xp-logon-box">
    <div class="logon-right">
      <div id="error-msg" class="error-msg">Invalid user or password</div>
      <label for="username">User name:</label>
      <input type="text" id="username" autocomplete="off" />

      <label for="password">Password:</label>
      <input type="password" id="password" />

      <div class="logon-btn-container">
        <button class="xp-ok-btn" onclick="attemptLogin()">OK</button>
      </div>
    </div>
  </div>

  <!-- Windows XP Dashboard App -->
  <div id="dashboard-app">
    <div class="xp-window">
      <div class="xp-title-bar">
        <div class="xp-title-text">
          <span class="xp-icon">💻</span> Ali's efficiency thingy majigy
        </div>
        <div class="xp-window-controls">
          <button class="xp-btn">_</button>
          <button class="xp-btn">□</button>
          <button class="xp-btn xp-close" onclick="logout()">✕</button>
        </div>
      </div>

      <div class="xp-body">
        <header class="header">
          <div>
            <h1 class="app-title">Ali's efficiency thingy majigy</h1>
            <p class="subtitle">Exam, travel, and administrative tracking dashboard</p>
          </div>
          <div class="clock-box">
            <div id="clock">--:--:--</div>
            <div class="timezone">Spain time</div>
          </div>
        </header>

        <div id="alert-container" class="urgent-alert-banner"></div>
        <div class="last-updated" id="last-updated">Loading schedule...</div>

        <h2>Upcoming Events</h2>
        <table class="schedule-table">
          <thead>
            <tr>
              <th>When</th>
              <th>Item</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody id="upcoming-tbody"></tbody>
        </table>

        <details class="archive-section">
          <summary>Archive · Finished Events</summary>
          <table class="schedule-table archive-table">
            <tbody id="archive-tbody"></tbody>
          </table>
        </details>
      </div>

      <div class="xp-status-bar">
        <span>System status: Active</span>
        <span>Sync interval: Every 3 hours</span>
      </div>
    </div>
  </div>

  <script>
    // Check session on load
    if (sessionStorage.getItem("xp_authenticated") === "true") {
      showDashboard();
    }

    function attemptLogin() {
      const u = document.getElementById("username").value.trim();
      const p = document.getElementById("password").value.trim();
      const err = document.getElementById("error-msg");

      if (u === "Admin" && p === "Aliiztheadminhere") {
        sessionStorage.setItem("xp_authenticated", "true");
        showDashboard();
      } else {
        err.style.display = "block";
      }
    }

    // Allow Enter key to submit login
    document.getElementById("password").addEventListener("keypress", function(e) {
      if (e.key === "Enter") attemptLogin();
    });

    function logout() {
      sessionStorage.removeItem("xp_authenticated");
      document.getElementById("dashboard-app").style.display = "none";
      document.getElementById("login-screen").style.display = "flex";
    }

    function showDashboard() {
      document.getElementById("login-screen").style.display = "none";
      document.getElementById("dashboard-app").style.display = "block";
      initDashboard();
    }

    function updateClock() {
      const now = new Date();
      const clockEl = document.getElementById('clock');
      if (clockEl) clockEl.innerText = now.toTimeString().split(' ')[0];
    }
    setInterval(updateClock, 1000);
    updateClock();

    function initDashboard() {
      fetch('schedule.json?t=' + new Date().getTime())
        .then(res => res.json())
        .then(data => {
          const alertBox = document.getElementById('alert-container');
          if (data.alerts && data.alerts.length > 0) {
            alertBox.style.display = 'block';
            alertBox.innerHTML = data.alerts.map(a => `
              <div class="urgent-alert-item">
                <span class="urgent-badge">CRITICAL</span> ${a}
              </div>
            `).join('');
          } else {
            alertBox.style.display = 'none';
          }

          const upcomingBody = document.getElementById('upcoming-tbody');
          upcomingBody.innerHTML = data.upcoming.map(item => `
            <tr>
              <td class="time-col">
                <div>${item.date}</div>
                <div class="sub-time">${item.time}</div>
              </td>
              <td class="detail-col">
                <span class="icon">○</span>
                <div>
                  <div class="item-title">${item.title}</div>
                  <div class="item-desc">${item.desc}</div>
                </div>
              </td>
              <td><span class="badge badge-${item.badge.toLowerCase().replace(/\s+/g, '-')}">${item.badge}</span></td>
            </tr>
          `).join('');

          if (data.archive && data.archive.length > 0) {
            const archiveBody = document.getElementById('archive-tbody');
            archiveBody.innerHTML = data.archive.map(item => `
              <tr>
                <td class="time-col"><div>${item.date}</div><div class="sub-time">${item.time}</div></td>
                <td class="detail-col">
                  <span class="icon">·</span>
                  <div>
                    <div class="item-title">${item.title}</div>
                    <div class="item-desc">${item.desc}</div>
                  </div>
                </td>
                <td><span class="badge badge-done">Done</span></td>
              </tr>
            `).join('');
          }

          document.getElementById('last-updated').innerText = "Checked every 3 hours. Last update: " + new Date().toLocaleString('en-GB', { timeZone: 'Europe/Madrid' });
        }).catch(err => {
          console.error("Could not load schedule.json", err);
        });
    }
  </script>
</body>
</html>
