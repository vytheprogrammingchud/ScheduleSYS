<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ali Chehade - Schedule</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <header class="header">
      <div>
        <h1>Ali Chehade</h1>
        <p class="subtitle">Exam and travel schedule</p>
      </div>
      <div class="clock-box">
        <div id="clock">--:--:--</div>
        <div class="timezone">Spain time</div>
      </div>
    </header>

    <div id="alert-container" class="alert-banner"></div>
    <div class="last-updated" id="last-updated">Loading schedule...</div>

    <h2>Upcoming Events</h2>
    <table class="schedule-table">
      <thead><tr><th>When</th><th>Item</th><th>Status</th></tr></thead>
      <tbody id="upcoming-tbody"></tbody>
    </table>

    <details class="archive-section">
      <summary>Archive · finished</summary>
      <table class="schedule-table archive-table">
        <tbody id="archive-tbody"></tbody>
      </table>
    </details>
  </div>

  <script>
    function updateClock() {
      const now = new Date();
      document.getElementById('clock').innerText = now.toTimeString().split(' ')[0];
    }
    setInterval(updateClock, 1000);
    updateClock();

    // Load dynamic JSON data
    fetch('schedule.json?t=' + new Date().getTime())
      .then(res => res.json())
      .then(data => {
        // Render alerts
        const alertBox = document.getElementById('alert-container');
        alertBox.innerHTML = data.alerts.map(a => `<div class="alert-item">${a}</div>`).join('');

        // Render upcoming
        const upcomingBody = document.getElementById('upcoming-tbody');
        upcomingBody.innerHTML = data.upcoming.map(item => `
          <tr>
            <td class="time-col"><div>${item.date}</div><div class="sub-time">${item.time}</div></td>
            <td class="detail-col">
              <span class="icon">○</span>
              <div>
                <div class="item-title">${item.title}</div>
                <div class="item-desc">${item.desc}</div>
              </div>
            </td>
            <td><span class="badge badge-${item.badge.toLowerCase()}">${item.badge}</span></td>
          </tr>
        `).join('');

        document.getElementById('last-updated').innerText = "Checked automatically. Last update: " + new Date().toUTCString();
      });
  </script>
</body>
</html>
