name: Sync Schedule Data

on:
  schedule:
    - cron: '0 */3 * * *' # Runs every 3 hours
  workflow_dispatch: # Allows manual trigger from GitHub

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Grants permission to commit changes back to the repo
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-auth google-auth-oauthlib google-api-python-client requests

      - name: Run sync script
        env:
          GMAIL_CREDENTIALS: ${{ secrets.GMAIL_CREDENTIALS }}
          GMAIL_CREDENTIALS_2: ${{ secrets.GMAIL_CREDENTIALS_2 }}
          GITHUB_TOKEN: ${{ secrets.AI_ACCESS_TOKEN }}
        run: |
          python update_schedule.py
