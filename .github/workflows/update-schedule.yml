name: Auto-Update Schedule from Gmail

on:
  schedule:
    - cron: '0 */3 * * *' # Triggers automatically every 3 hours
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install google-auth-oauthlib google-auth-httplib2 google-api-python-client requests

      - name: Run schedule updater script
        env:
          GMAIL_CREDENTIALS: ${{ secrets.GMAIL_CREDENTIALS }}
          GMAIL_CREDENTIALS_2: ${{ secrets.GMAIL_CREDENTIALS_2 }}
        run: python scripts/sync_gmail.py

      - name: Commit and push changes if schedule updated
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "bot@github.local"
          git add schedule.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update schedule from Gmail sync" && git push)
